<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bio-Scanner v4.2</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');
        
        body {
            font-family: 'Share Tech Mono', monospace;
            background-color: #050505;
            color: #10b981; /* green-500 */
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
            transition: background-color 0.5s ease-in-out;
        }

        /* Patrón de cuadrícula de fondo cibernético */
        .bg-grid {
            background-size: 50px 50px;
            background-image: 
                linear-gradient(to right, rgba(16, 185, 129, 0.07) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(16, 185, 129, 0.07) 1px, transparent 1px);
        }

        .scan-line {
            position: absolute;
            width: 100%;
            height: 3px;
            background: #10b981;
            box-shadow: 0 0 20px #10b981, 0 0 40px #10b981;
            animation: scan 3s linear infinite;
            z-index: 50;
        }

        @keyframes scan {
            0% { top: -10%; opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { top: 110%; opacity: 0; }
        }

        /* HUD de Radar circular */
        .radar-circle {
            position: relative;
            width: 200px;
            height: 200px;
            border: 2px solid rgba(16, 185, 129, 0.5);
            border-radius: 50%;
            box-shadow: 0 0 30px rgba(16, 185, 129, 0.2) inset;
            overflow: hidden;
        }
        .radar-circle::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 100%;
            height: 100%;
            background: conic-gradient(from 0deg, transparent 70%, rgba(16, 185, 129, 0.8) 100%);
            transform-origin: 0 0;
            animation: spin 2s linear infinite;
        }
        .radar-circle::after {
            content: '';
            position: absolute;
            top: 50%; left: 0; width: 100%; height: 1px; background: rgba(16, 185, 129, 0.3);
        }
        .radar-vline {
            position: absolute;
            top: 0; left: 50%; width: 1px; height: 100%; background: rgba(16, 185, 129, 0.3);
        }

        @keyframes spin {
            100% { transform: rotate(360deg); }
        }

        .hidden { display: none !important; }

        .bg-error { background-color: #450a0a !important; color: #fca5a5 !important; } /* red-950, red-300 */
        .bg-success { background-color: #064e3b !important; color: #6ee7b7 !important; } /* emerald-900, emerald-300 */
        .bg-normal { background-color: #050505 !important; color: #10b981 !important; }

        .card-btn, .suit-btn {
            border: 2px solid #10b981;
            color: #10b981;
            border-radius: 0.5rem;
            padding: 0.5rem;
            text-align: center;
            transition: all 0.2s;
            background: rgba(0,0,0,0.5);
        }
        .card-btn { font-size: 1.25rem; }
        .suit-btn { font-size: 2rem; }
        .card-btn.selected, .suit-btn.selected {
            background-color: #10b981;
            color: #000;
            box-shadow: 0 0 15px #10b981;
        }

        /* Glitch y animaciones de texto */
        .cyber-text {
            text-shadow: 0 0 10px currentColor;
        }
        .data-stream {
            font-size: 0.7rem;
            opacity: 0.3;
            line-height: 1;
            word-break: break-all;
        }
    </style>
</head>
<body class="h-screen w-screen flex flex-col items-center justify-center relative bg-normal bg-grid" id="main-body">

    <!-- OVERLAY DE DATOS HEXADECIMALES (Se muestra en el escaneo) -->
    <div id="hex-stream" class="absolute inset-0 overflow-hidden text-green-700 data-stream p-2 hidden z-0 pointer-events-none"></div>

    <div id="debug-overlay" class="absolute bottom-2 left-2 right-2 text-[10px] text-gray-600 opacity-40 z-50 pointer-events-none text-center font-sans">
        [SYS_MIC: <span id="debug-text">STANDBY</span>]
    </div>

    <!-- MODAL DE SELECCIÓN DE CARTA -->
    <div id="card-selector-modal" class="hidden absolute top-0 left-0 w-full h-full bg-black bg-opacity-95 z-[100] flex flex-col items-center justify-center p-4 backdrop-blur-sm">
        <h3 class="text-2xl text-emerald-500 mb-6 cyber-text">⚙️ CONFIGURACIÓN NÚCLEO</h3>
        
        <p class="text-emerald-700 mb-2 text-sm tracking-widest">PARÁMETRO 1: VALOR</p>
        <div class="grid grid-cols-7 gap-2 mb-6 w-full max-w-sm" id="value-grid">
            <button class="card-btn" data-val="As">A</button>
            <button class="card-btn" data-val="2">2</button>
            <button class="card-btn" data-val="3">3</button>
            <button class="card-btn" data-val="4">4</button>
            <button class="card-btn" data-val="5">5</button>
            <button class="card-btn" data-val="6">6</button>
            <button class="card-btn" data-val="7">7</button>
            <button class="card-btn" data-val="8">8</button>
            <button class="card-btn" data-val="9">9</button>
            <button class="card-btn" data-val="10">10</button>
            <button class="card-btn" data-val="Jota">J</button>
            <button class="card-btn" data-val="Reina">Q</button>
            <button class="card-btn" data-val="Rey">K</button>
            <button class="card-btn" data-val="Joker">Jkr</button>
        </div>
        
        <p class="text-emerald-700 mb-2 text-sm tracking-widest">PARÁMETRO 2: IDENTIFICADOR</p>
        <div class="grid grid-cols-4 gap-4 mb-8 w-full max-w-sm" id="suit-grid">
            <button class="suit-btn" data-suit="de Corazones"><span class="text-red-500">♥</span></button>
            <button class="suit-btn" data-suit="de Picas"><span>♠</span></button>
            <button class="suit-btn" data-suit="de Tréboles"><span>♣</span></button>
            <button class="suit-btn" data-suit="de Diamantes"><span class="text-red-500">♦</span></button>
        </div>

        <div class="bg-gray-900 border border-emerald-800 w-full max-w-sm p-4 rounded text-center mb-8">
            <p class="text-xs text-emerald-600 mb-1">OBJETIVO ENCRIPTADO:</p>
            <p id="preview-selection" class="text-2xl text-white font-bold cyber-text">...</p>
        </div>
        
        <div class="flex gap-4 w-full max-w-sm">
            <button id="cancel-card-btn" class="flex-1 border-2 border-red-900 text-red-500 py-3 rounded text-lg tracking-widest hover:bg-red-900">ABORTAR</button>
            <button id="save-card-btn" class="flex-1 bg-emerald-600 text-black py-3 rounded text-lg font-bold tracking-widest hover:bg-emerald-500 shadow-[0_0_15px_rgba(16,185,129,0.5)]">CONFIRMAR</button>
        </div>
    </div>

    <!-- PANTALLA 1: INICIO -->
    <div id="start-screen" class="w-full h-full flex flex-col items-center justify-center p-4 relative z-10">
        <h1 id="app-title" class="text-5xl font-bold mb-2 tracking-widest text-center cursor-pointer transition-opacity duration-300 cyber-text">
            BIO-SCAN
        </h1>
        <p class="text-emerald-700 tracking-widest mb-16 text-sm">v4.2.0_ALPHA</p>
        
        <button id="enter-btn" class="relative overflow-hidden border-2 border-emerald-500 text-emerald-400 px-10 py-6 text-2xl font-bold rounded hover:bg-emerald-500 hover:text-black transition-all shadow-[0_0_30px_rgba(16,185,129,0.2)] active:scale-95 group bg-black bg-opacity-50 backdrop-blur-sm">
            <span class="relative z-10 tracking-wider">CONECTAR SISTEMA</span>
            <div class="absolute inset-0 bg-emerald-500 opacity-0 group-hover:opacity-20 transition-opacity"></div>
        </button>
        
        <div class="mt-12 flex flex-col items-center">
            <div class="w-2 h-2 bg-emerald-700 rounded-full animate-ping mb-2"></div>
            <p id="mic-status" class="text-xs text-emerald-800 opacity-70 tracking-widest">ESPERANDO INICIALIZACIÓN</p>
        </div>
    </div>

    <!-- PANTALLA 2: ESCÁNER PRINCIPAL -->
    <div id="main-scanner-screen" class="hidden w-full h-full flex flex-col items-center justify-center p-6 relative z-10">
        
        <!-- ESTADO: REPOSO -->
        <div id="scanner-idle" class="w-full h-full flex flex-col items-center justify-center">
            
            <div class="relative flex items-center justify-center mb-16">
                <!-- Efecto de onda exterior -->
                <div class="absolute w-48 h-48 border border-emerald-800 rounded-full animate-ping opacity-20"></div>
                <div class="absolute w-40 h-40 border border-emerald-600 rounded-full animate-ping opacity-40" style="animation-delay: 0.5s"></div>
                
                <!-- Botón central de escaneo -->
                <button id="start-scan-btn" class="relative w-32 h-32 rounded-full bg-black border-4 border-emerald-500 flex flex-col items-center justify-center shadow-[0_0_40px_rgba(16,185,129,0.4)] hover:bg-emerald-900 transition-colors active:scale-90 group z-10">
                    <svg class="w-12 h-12 text-emerald-400 group-hover:text-emerald-300 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 11c0 3.517-1.009 6.799-2.753 9.571m-3.44-2.04l.054-.09A13.916 13.916 0 008 11a4 4 0 118 0c0 1.017-.07 2.019-.203 3m-2.118 6.844A21.88 21.88 0 0015.171 17m3.839 1.132c.645-2.266.99-4.659.99-7.132A8 8 0 008 4.07M3 15.364c.64-1.319 1-2.8 1-4.364 0-1.457.39-2.823 1.07-4"></path></svg>
                    <span class="text-[10px] font-bold tracking-widest text-emerald-400">INICIAR</span>
                </button>
            </div>
            
            <p class="text-emerald-600 text-sm tracking-widest opacity-80 uppercase">Listo para escanear sujeto</p>
        </div>

        <!-- ESTADO: ESCANEANDO -->
        <div id="scanner-active" class="hidden w-full h-full flex-col items-center justify-center">
            <div class="scan-line"></div>
            
            <div class="radar-circle mb-12">
                <div class="radar-vline"></div>
                <div class="absolute inset-0 flex items-center justify-center">
                    <svg class="w-16 h-16 text-emerald-500 opacity-50 animate-pulse" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1" d="M21 12a9 9 0 01-9 9m9-9a9 9 0 00-9-9m9 9H3m9 9a9 9 0 01-9-9m9 9c1.657 0 3-4.03 3-9s-1.343-9-3-9m0 18c-1.657 0-3-4.03-3-9s1.343-9 3-9m-9 9a9 9 0 019-9"></path></svg>
                </div>
            </div>

            <div class="w-full max-w-sm bg-gray-900 border border-emerald-800 p-1 rounded mb-4">
                <div id="progress-bar" class="bg-emerald-500 h-2 w-0 transition-all duration-1000 ease-linear shadow-[0_0_10px_#10b981]"></div>
            </div>
            
            <p id="scan-text" class="text-lg text-center text-emerald-400 tracking-wider h-8">
                Inicializando biometría...
            </p>
            <p class="text-[10px] text-emerald-700 mt-2 tracking-widest">PROCESANDO DATOS NEURONALES</p>
        </div>

        <!-- ESTADO: RESULTADO -->
        <div id="scanner-result" class="hidden w-full h-full flex-col items-center justify-center text-center relative z-20">
            <div class="border-y border-current w-full py-4 mb-8 bg-black bg-opacity-20 backdrop-blur-sm shadow-[0_0_30px_currentColor]">
                <p class="text-sm mb-2 tracking-widest opacity-70 uppercase">Estado del Sujeto</p>
                <h2 id="result-title" class="text-6xl font-black tracking-widest cyber-text"></h2>
            </div>
            
            <div id="card-reveal-container" class="hidden w-full max-w-sm border border-current p-6 rounded bg-black bg-opacity-40 backdrop-blur-md shadow-[0_0_40px_currentColor] relative overflow-hidden">
                <div class="absolute top-0 left-0 w-full h-1 bg-current opacity-50"></div>
                <p class="text-xs mb-4 tracking-widest opacity-60">OBJETIVO EXTRAÍDO:</p>
                <p id="secret-card-display" class="text-4xl font-bold tracking-wider cyber-text"></p>
                <div class="absolute bottom-0 left-0 w-full h-1 bg-current opacity-50"></div>
            </div>
            
            <button id="reset-scan-btn" class="mt-16 text-sm border border-current px-8 py-3 rounded hover:bg-white hover:bg-opacity-10 transition-colors tracking-widest">
                REINICIAR ESCÁNER
            </button>
        </div>
    </div>

    <script>
        const body = document.getElementById('main-body');
        const titleEl = document.getElementById('app-title');
        const enterBtn = document.getElementById('enter-btn');
        const startScreen = document.getElementById('start-screen');
        const mainScannerScreen = document.getElementById('main-scanner-screen');
        
        const scannerIdle = document.getElementById('scanner-idle');
        const startScanBtn = document.getElementById('start-scan-btn');
        const scannerActive = document.getElementById('scanner-active');
        const progressBar = document.getElementById('progress-bar');
        const scanText = document.getElementById('scan-text');
        const hexStream = document.getElementById('hex-stream');
        
        const scannerResult = document.getElementById('scanner-result');
        const resultTitle = document.getElementById('result-title');
        const cardRevealContainer = document.getElementById('card-reveal-container');
        const secretCardDisplay = document.getElementById('secret-card-display');
        const resetScanBtn = document.getElementById('reset-scan-btn');
        const debugText = document.getElementById('debug-text');
        const micStatus = document.getElementById('mic-status');
        
        const cardSelectorModal = document.getElementById('card-selector-modal');
        const saveCardBtn = document.getElementById('save-card-btn');
        const cancelCardBtn = document.getElementById('cancel-card-btn');
        const previewSelection = document.getElementById('preview-selection');
        const valueBtns = document.querySelectorAll('.card-btn');
        const suitBtns = document.querySelectorAll('.suit-btn');

        let longPressTimer;
        let recognition = null;
        let isFakeDetected = false;
        let cardRevealRequested = false;
        let isScanningOrResult = false;
        let currentStatus = 'idle';

        let tempValue = "As";
        let tempSuit = "de Picas";
        const DEFAULT_CARD = "As de Picas";

        // ==========================================
        // MOTOR DE SONIDO
        // ==========================================
        let audioCtx;
        let scanIntervalId;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function startScanSound() {
            if (!audioCtx) return;
            scanIntervalId = setInterval(() => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.type = 'sine';
                osc.frequency.setValueAtTime(1200 + Math.random() * 800, audioCtx.currentTime); 
                gain.gain.setValueAtTime(0.015, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.05);
            }, 150); 
        }

        function stopScanSound() {
            clearInterval(scanIntervalId);
        }

        function playSuccessSound() {
            if (!audioCtx) return;
            const playNote = (freq, timeOffset) => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.type = 'sine';
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime + timeOffset);
                gain.gain.setValueAtTime(0, audioCtx.currentTime + timeOffset);
                gain.gain.linearRampToValueAtTime(0.1, audioCtx.currentTime + timeOffset + 0.05);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + timeOffset + 0.6);
                osc.start(audioCtx.currentTime + timeOffset);
                osc.stop(audioCtx.currentTime + timeOffset + 0.6);
            };
            playNote(880, 0);     // A5
            playNote(1318.51, 0.15); // E6
        }

        function playErrorSound() {
            if (!audioCtx) return;
            const playBuzz = (timeOffset) => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(110, audioCtx.currentTime + timeOffset); // Más grave
                gain.gain.setValueAtTime(0, audioCtx.currentTime + timeOffset);
                gain.gain.linearRampToValueAtTime(0.15, audioCtx.currentTime + timeOffset + 0.02);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + timeOffset + 0.4);
                osc.start(audioCtx.currentTime + timeOffset);
                osc.stop(audioCtx.currentTime + timeOffset + 0.4);
            };
            playBuzz(0);
            playBuzz(0.25);
        }
        // ==========================================

        document.addEventListener('DOMContentLoaded', () => {
            initSpeechRecognition();
            if (!localStorage.getItem('secretCard')) {
                localStorage.setItem('secretCard', DEFAULT_CARD);
            }
        });

        // ------------------ SELECTOR VISUAL ------------------
        function startLongPress(e) {
            titleEl.style.opacity = '0.3';
            longPressTimer = setTimeout(() => {
                titleEl.style.opacity = '1';
                openCardSelector();
            }, 2000);
        }

        function cancelLongPress() {
            clearTimeout(longPressTimer);
            titleEl.style.opacity = '1';
        }

        titleEl.addEventListener('touchstart', startLongPress, {passive: true});
        titleEl.addEventListener('mousedown', startLongPress);
        titleEl.addEventListener('touchend', cancelLongPress);
        titleEl.addEventListener('mouseup', cancelLongPress);
        titleEl.addEventListener('mouseleave', cancelLongPress);

        function updatePreview() {
            previewSelection.textContent = tempValue === "Joker" ? "JOKER" : `${tempValue.toUpperCase()} ${tempSuit.toUpperCase()}`;
        }

        function openCardSelector() {
            tempValue = "As"; tempSuit = "de Picas";
            valueBtns.forEach(b => b.classList.remove('selected'));
            suitBtns.forEach(b => b.classList.remove('selected'));
            valueBtns[0].classList.add('selected');
            suitBtns[1].classList.add('selected');
            updatePreview();
            cardSelectorModal.classList.remove('hidden');
        }

        valueBtns.forEach(btn => {
            btn.addEventListener('click', (e) => {
                valueBtns.forEach(b => b.classList.remove('selected'));
                e.currentTarget.classList.add('selected');
                tempValue = e.currentTarget.getAttribute('data-val');
                updatePreview();
            });
        });

        suitBtns.forEach(btn => {
            btn.addEventListener('click', (e) => {
                suitBtns.forEach(b => b.classList.remove('selected'));
                e.currentTarget.classList.add('selected');
                tempSuit = e.currentTarget.getAttribute('data-suit');
                updatePreview();
            });
        });

        saveCardBtn.addEventListener('click', () => {
            let finalCard = tempValue === "Joker" ? "Joker" : `${tempValue} ${tempSuit}`;
            localStorage.setItem('secretCard', finalCard);
            cardSelectorModal.classList.add('hidden');
        });

        cancelCardBtn.addEventListener('click', () => {
            cardSelectorModal.classList.add('hidden');
        });

        // ------------------ RECONOCIMIENTO DE VOZ ------------------
        function initSpeechRecognition() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (SpeechRecognition) {
                recognition = new SpeechRecognition();
                recognition.lang = 'es-AR'; 
                recognition.interimResults = true;
                recognition.continuous = true;

                recognition.onresult = (event) => {
                    let latestTranscript = "";
                    for (let i = event.resultIndex; i < event.results.length; ++i) {
                        latestTranscript += event.results[i][0].transcript.toLowerCase();
                    }
                    
                    if (latestTranscript.trim() === "") return;
                    debugText.textContent = latestTranscript.slice(-30);

                    // Sólo escuchar la palabra trampa si el escáner está corriendo
                    if (currentStatus === 'scanning') {
                        if (latestTranscript.includes("falso") || latestTranscript.includes("mentira") || latestTranscript.includes("falsa")) {
                            isFakeDetected = true;
                        }
                        // Detectar si pide revelar la carta ANTES de terminar
                        if (latestTranscript.includes("latido") || latestTranscript.includes("latidos")) {
                            cardRevealRequested = true;
                        }
                    }

                    if (currentStatus === 'success') {
                        // Si lo pide DESPUÉS de terminar el escaneo
                        if (!cardRevealRequested && (latestTranscript.includes("latido") || latestTranscript.includes("latidos"))) {
                            cardRevealRequested = true;
                            revealCard();
                        }
                    }
                };

                recognition.onerror = (event) => {
                    if (event.error !== 'no-speech') {
                        micStatus.textContent = "SYS_ERR: " + event.error.toUpperCase();
                    }
                };

                recognition.onend = () => {
                    if (isScanningOrResult && recognition) {
                        try { recognition.start(); } catch(e) {}
                    }
                };
            } else {
                micStatus.textContent = "SYS_ERR: NATIVE_API_BLOCKED";
            }
        }

        // ------------------ FLUJO DE PANTALLAS ------------------
        enterBtn.addEventListener('click', async () => {
            initAudio();

            if ('speechSynthesis' in window) {
                const unlockAudio = new SpeechSynthesisUtterance('');
                speechSynthesis.speak(unlockAudio);
            }

            isScanningOrResult = true;
            if (recognition) {
                try { recognition.start(); } catch(e) {}
            }

            startScreen.classList.add('hidden');
            mainScannerScreen.classList.remove('hidden');
            mainScannerScreen.classList.add('flex');
            showIdleScanner();
        });

        function showIdleScanner() {
            currentStatus = 'idle';
            body.className = "h-screen w-screen flex flex-col items-center justify-center relative bg-normal bg-grid transition-colors duration-700";
            scannerIdle.classList.remove('hidden');
            scannerIdle.classList.add('flex');
            scannerActive.classList.add('hidden');
            scannerActive.classList.remove('flex');
            scannerResult.classList.add('hidden');
            scannerResult.classList.remove('flex');
            cardRevealContainer.classList.add('hidden');
            hexStream.classList.add('hidden');
            debugText.textContent = "STANDBY"; 
        }

        // Generador de lluvia hexadecimal visual
        let hexInterval;
        function startHexStream() {
            hexStream.classList.remove('hidden');
            hexStream.innerHTML = '';
            hexInterval = setInterval(() => {
                let text = '';
                for(let i=0; i<300; i++) {
                    text += Math.floor(Math.random()*16).toString(16).toUpperCase() + ' ';
                }
                hexStream.innerText = text;
            }, 100);
        }
        function stopHexStream() {
            clearInterval(hexInterval);
            hexStream.classList.add('hidden');
        }

        // INICIAR ESCANEO (AHORA 6 SEGUNDOS)
        startScanBtn.addEventListener('click', () => {
            currentStatus = 'scanning';
            
            if (recognition) {
                try { recognition.stop(); } catch(e) {}
                setTimeout(() => { try { recognition.start(); } catch(e) {} }, 100);
            }

            startScanSound();
            startHexStream();

            isFakeDetected = false;
            cardRevealRequested = false;
            debugText.textContent = "REC..."; 

            scannerIdle.classList.add('hidden');
            scannerIdle.classList.remove('flex');
            scannerActive.classList.remove('hidden');
            scannerActive.classList.add('flex');

            const messages = [
                "Inicializando sensores...",
                "Analizando campo magnético...",
                "Buscando patrones cognitivos...",
                "Calibrando frecuencia base...",
                "Verificando integridad..."
            ];

            let currentSecond = 0;
            progressBar.style.width = '0%';

            const scanInterval = setInterval(() => {
                currentSecond++;
                progressBar.style.width = `${(currentSecond / 5) * 100}%`;
                
                if (currentSecond < 5) {
                    scanText.textContent = messages[currentSecond];
                } else {
                    clearInterval(scanInterval);
                    finishScan();
                }
            }, 1000);
        });

        function finishScan() {
            stopScanSound();
            stopHexStream();

            scannerActive.classList.add('hidden');
            scannerActive.classList.remove('flex');
            scannerResult.classList.remove('hidden');
            scannerResult.classList.add('flex');

            if (isFakeDetected) {
                currentStatus = 'error';
                playErrorSound();
                body.className = "h-screen w-screen flex flex-col items-center justify-center relative bg-error transition-colors duration-500";
                resultTitle.textContent = "FALSO";
            } else {
                currentStatus = 'success';
                playSuccessSound();
                body.className = "h-screen w-screen flex flex-col items-center justify-center relative bg-success transition-colors duration-500";
                resultTitle.textContent = "VERDADERO";
                
                if (cardRevealRequested) {
                    setTimeout(() => revealCard(), 1000); // 1s de pausa para dar más impacto
                }
            }
        }

        function revealCard() {
            if (currentStatus !== 'success') return;
            
            const card = localStorage.getItem('secretCard') || DEFAULT_CARD;
            secretCardDisplay.textContent = card.toUpperCase();
            cardRevealContainer.classList.remove('hidden');
            
            if ('speechSynthesis' in window) {
                const utterance = new SpeechSynthesisUtterance(`La carta elegida es el ${card}`);
                utterance.lang = 'es-AR';
                utterance.rate = 0.9;
                utterance.pitch = 0.8;
                speechSynthesis.speak(utterance);
            }
        }

        resetScanBtn.addEventListener('click', () => {
            showIdleScanner();
        });
    </script>
</body>
</html>
