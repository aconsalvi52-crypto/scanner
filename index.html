<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bio-Scanner v4.2</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');
        
        body {
            font-family: 'Share Tech Mono', monospace;
            background-color: #050505;
            color: #0f0;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
            transition: background-color 0.5s ease-in-out;
        }

        .scan-line {
            position: absolute;
            width: 100%;
            height: 2px;
            background: #0f0;
            box-shadow: 0 0 15px #0f0;
            animation: scan 2s linear infinite;
        }

        @keyframes scan {
            0% { top: 0%; opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { top: 100%; opacity: 0; }
        }

        .hidden { display: none !important; }

        .bg-error { background-color: #990000 !important; color: white !important; }
        .bg-success { background-color: #004400 !important; color: #0f0 !important; }
        .bg-normal { background-color: #050505 !important; color: #0f0 !important; }

        .card-btn, .suit-btn {
            border: 2px solid #0f0;
            color: #0f0;
            border-radius: 0.5rem;
            padding: 0.5rem;
            text-align: center;
            transition: all 0.2s;
        }
        .card-btn { font-size: 1.25rem; }
        .suit-btn { font-size: 2rem; }
        .card-btn.selected, .suit-btn.selected {
            background-color: #0f0;
            color: #000;
        }
    </style>
</head>
<body class="h-screen w-screen flex flex-col items-center justify-center relative bg-normal" id="main-body">

    <!-- DEBUG OVERLAY PARA IPHONE -->
    <div id="debug-overlay" class="absolute bottom-2 left-2 right-2 text-xs text-gray-500 opacity-50 z-50 pointer-events-none text-center">
        [iOS Mic: <span id="debug-text">...</span>]
    </div>

    <!-- MODAL DE SELECCIÓN DE CARTA -->
    <div id="card-selector-modal" class="hidden absolute top-0 left-0 w-full h-full bg-black bg-opacity-95 z-[100] flex flex-col items-center justify-center p-4">
        <h3 class="text-2xl text-green-500 mb-6">⚙️ CONFIGURAR CARTA SECRETA</h3>
        
        <p class="text-green-700 mb-2 text-sm">VALOR</p>
        <div class="grid grid-cols-7 gap-2 mb-6 w-full max-w-sm" id="value-grid">
            <button class="card-btn" data-val="As">A</button>
            <button class="card-btn" data-val="2">2</button>
            <button class="card-btn" data-val="3">3</button>
            <button class="card-btn" data-val="4">4</button>
            <button class="card-btn" data-val="5">5</button>
            <button class="card-btn" data-val="6">6</button>
            <button class="card-btn" data-val="7">7</button>
            <button class="card-btn" data-val="8">8</button>
            <button class="card-btn" data-val="9">9</button>
            <button class="card-btn" data-val="10">10</button>
            <button class="card-btn" data-val="Jota">J</button>
            <button class="card-btn" data-val="Reina">Q</button>
            <button class="card-btn" data-val="Rey">K</button>
            <button class="card-btn" data-val="Joker">Jkr</button>
        </div>
        
        <p class="text-green-700 mb-2 text-sm">PALO</p>
        <div class="grid grid-cols-4 gap-4 mb-8 w-full max-w-sm" id="suit-grid">
            <button class="suit-btn" data-suit="de Corazones"><span class="text-red-500">♥</span></button>
            <button class="suit-btn" data-suit="de Picas"><span>♠</span></button>
            <button class="suit-btn" data-suit="de Tréboles"><span>♣</span></button>
            <button class="suit-btn" data-suit="de Diamantes"><span class="text-red-500">♦</span></button>
        </div>

        <p id="preview-selection" class="text-2xl text-white mb-8 h-8 text-center font-bold">...</p>
        
        <div class="flex gap-6">
            <button id="cancel-card-btn" class="border-2 border-red-800 text-red-500 px-6 py-3 rounded text-xl">VOLVER</button>
            <button id="save-card-btn" class="bg-green-600 text-black px-6 py-3 rounded text-xl font-bold">GUARDAR</button>
        </div>
    </div>

    <!-- PANTALLA 1: INICIO -->
    <div id="start-screen" class="w-full h-full flex flex-col items-center justify-center p-4">
        <h1 id="app-title" class="text-4xl font-bold mb-16 tracking-widest text-center cursor-pointer transition-opacity duration-300">
            BIO-SCANNER v4.2
        </h1>
        <button id="enter-btn" class="border-2 border-green-500 text-green-500 px-8 py-5 text-2xl font-bold rounded-lg hover:bg-green-500 hover:text-black transition-all shadow-[0_0_20px_rgba(0,255,0,0.4)] active:scale-95 active:shadow-none">
            ENTRAR AL SISTEMA
        </button>
        <p id="mic-status" class="mt-8 text-xs text-green-800 opacity-50">SISTEMA EN ESPERA</p>
    </div>

    <!-- PANTALLA 2: ESCÁNER PRINCIPAL -->
    <div id="main-scanner-screen" class="hidden w-full h-full flex flex-col items-center justify-center p-8 relative">
        <div id="scanner-idle" class="w-full h-full flex flex-col items-center justify-center">
            <div class="border-4 border-green-500 p-8 rounded-full mb-12 flex items-center justify-center shadow-[0_0_30px_rgba(0,255,0,0.3)]">
                <span class="text-6xl">📡</span>
            </div>
            <button id="start-scan-btn" class="border-2 border-green-500 px-8 py-4 text-xl font-bold rounded-lg hover:bg-green-500 hover:text-black transition-all active:scale-95">
                INICIAR ESCANEO
            </button>
        </div>

        <div id="scanner-active" class="hidden w-full h-full flex-col items-center justify-center">
            <div class="scan-line"></div>
            <div class="w-full max-w-sm border-2 border-current h-10 p-1 rounded relative z-10 bg-black">
                <div id="progress-bar" class="bg-current h-full w-0 transition-all duration-1000 ease-linear shadow-[0_0_10px_currentColor]"></div>
            </div>
            <p id="scan-text" class="mt-8 text-xl text-center animate-pulse relative z-10">
                Iniciando protocolo...
            </p>
        </div>

        <div id="scanner-result" class="hidden w-full h-full flex-col items-center justify-center text-center relative z-20">
            <p class="text-xl text-white mb-2 tracking-widest opacity-80 uppercase">Escaneo finalizado</p>
            <h2 id="result-title" class="text-6xl font-bold mb-6 animate-pulse"></h2>
            
            <div id="card-reveal-container" class="hidden mt-8 border-4 border-current p-8 rounded-xl bg-black bg-opacity-30 shadow-[0_0_40px_currentColor]">
                <p class="text-xl mb-4 tracking-widest opacity-80">RESULTADO DE ANÁLISIS:</p>
                <p id="secret-card-display" class="text-5xl font-bold tracking-wider"></p>
            </div>
            
            <button id="reset-scan-btn" class="mt-16 border-2 border-current px-8 py-3 rounded hover:bg-white hover:bg-opacity-20 transition-colors">
                NUEVO ESCANEO
            </button>
        </div>
    </div>

    <script>
        const body = document.getElementById('main-body');
        const titleEl = document.getElementById('app-title');
        const enterBtn = document.getElementById('enter-btn');
        const startScreen = document.getElementById('start-screen');
        const mainScannerScreen = document.getElementById('main-scanner-screen');
        
        const scannerIdle = document.getElementById('scanner-idle');
        const startScanBtn = document.getElementById('start-scan-btn');
        const scannerActive = document.getElementById('scanner-active');
        const progressBar = document.getElementById('progress-bar');
        const scanText = document.getElementById('scan-text');
        
        const scannerResult = document.getElementById('scanner-result');
        const resultTitle = document.getElementById('result-title');
        const cardRevealContainer = document.getElementById('card-reveal-container');
        const secretCardDisplay = document.getElementById('secret-card-display');
        const resetScanBtn = document.getElementById('reset-scan-btn');
        const debugText = document.getElementById('debug-text');
        const micStatus = document.getElementById('mic-status');
        
        const cardSelectorModal = document.getElementById('card-selector-modal');
        const saveCardBtn = document.getElementById('save-card-btn');
        const cancelCardBtn = document.getElementById('cancel-card-btn');
        const previewSelection = document.getElementById('preview-selection');
        const valueBtns = document.querySelectorAll('.card-btn');
        const suitBtns = document.querySelectorAll('.suit-btn');

        let longPressTimer;
        let recognition = null;
        let isFakeDetected = false;
        let cardRevealRequested = false;
        let isScanningOrResult = false;
        let currentStatus = 'idle';

        let tempValue = "As";
        let tempSuit = "de Picas";
        const DEFAULT_CARD = "As de Picas";

        // ==========================================
        // MOTOR DE SONIDO SINTÉTICO (Web Audio API)
        // ==========================================
        let audioCtx;
        let scanIntervalId;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        // Sonido 1: Pitidos tipo radar durante el escaneo
        function startScanSound() {
            if (!audioCtx) return;
            scanIntervalId = setInterval(() => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                
                osc.type = 'sine';
                osc.frequency.setValueAtTime(1000 + Math.random() * 500, audioCtx.currentTime); 
                
                gain.gain.setValueAtTime(0.02, audioCtx.currentTime); // Volumen bajito
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
                
                osc.start();
                osc.stop(audioCtx.currentTime + 0.1);
            }, 300); // Un pitido cada 300ms
        }

        function stopScanSound() {
            clearInterval(scanIntervalId);
        }

        // Sonido 2: Acierto (Verde) - Doble campana aguda
        function playSuccessSound() {
            if (!audioCtx) return;
            const playNote = (freq, timeOffset) => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                
                osc.type = 'sine';
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime + timeOffset);
                
                gain.gain.setValueAtTime(0, audioCtx.currentTime + timeOffset);
                gain.gain.linearRampToValueAtTime(0.1, audioCtx.currentTime + timeOffset + 0.05);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + timeOffset + 0.5);
                
                osc.start(audioCtx.currentTime + timeOffset);
                osc.stop(audioCtx.currentTime + timeOffset + 0.5);
            };
            
            playNote(800, 0);     // Primer tono
            playNote(1200, 0.15); // Segundo tono más agudo
        }

        // Sonido 3: Error (Rojo) - Doble zumbido grave
        function playErrorSound() {
            if (!audioCtx) return;
            const playBuzz = (timeOffset) => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                
                osc.type = 'sawtooth'; // Sonido rasposo/zumbido
                osc.frequency.setValueAtTime(150, audioCtx.currentTime + timeOffset);
                
                gain.gain.setValueAtTime(0, audioCtx.currentTime + timeOffset);
                gain.gain.linearRampToValueAtTime(0.1, audioCtx.currentTime + timeOffset + 0.05);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + timeOffset + 0.3);
                
                osc.start(audioCtx.currentTime + timeOffset);
                osc.stop(audioCtx.currentTime + timeOffset + 0.3);
            };

            playBuzz(0);
            playBuzz(0.2);
        }
        // ==========================================


        document.addEventListener('DOMContentLoaded', () => {
            initSpeechRecognition();
            if (!localStorage.getItem('secretCard')) {
                localStorage.setItem('secretCard', DEFAULT_CARD);
            }
        });

        // ------------------ SELECTOR VISUAL ------------------
        function startLongPress(e) {
            titleEl.style.opacity = '0.5';
            longPressTimer = setTimeout(() => {
                titleEl.style.opacity = '1';
                openCardSelector();
            }, 2000);
        }

        function cancelLongPress() {
            clearTimeout(longPressTimer);
            titleEl.style.opacity = '1';
        }

        titleEl.addEventListener('touchstart', startLongPress, {passive: true});
        titleEl.addEventListener('mousedown', startLongPress);
        titleEl.addEventListener('touchend', cancelLongPress);
        titleEl.addEventListener('mouseup', cancelLongPress);
        titleEl.addEventListener('mouseleave', cancelLongPress);

        function updatePreview() {
            previewSelection.textContent = tempValue === "Joker" ? "Joker" : `${tempValue} ${tempSuit}`;
        }

        function openCardSelector() {
            tempValue = "As"; tempSuit = "de Picas";
            valueBtns.forEach(b => b.classList.remove('selected'));
            suitBtns.forEach(b => b.classList.remove('selected'));
            valueBtns[0].classList.add('selected');
            suitBtns[1].classList.add('selected');
            updatePreview();
            cardSelectorModal.classList.remove('hidden');
        }

        valueBtns.forEach(btn => {
            btn.addEventListener('click', (e) => {
                valueBtns.forEach(b => b.classList.remove('selected'));
                e.currentTarget.classList.add('selected');
                tempValue = e.currentTarget.getAttribute('data-val');
                updatePreview();
            });
        });

        suitBtns.forEach(btn => {
            btn.addEventListener('click', (e) => {
                suitBtns.forEach(b => b.classList.remove('selected'));
                e.currentTarget.classList.add('selected');
                tempSuit = e.currentTarget.getAttribute('data-suit');
                updatePreview();
            });
        });

        saveCardBtn.addEventListener('click', () => {
            let finalCard = tempValue === "Joker" ? "Joker" : `${tempValue} ${tempSuit}`;
            localStorage.setItem('secretCard', finalCard);
            cardSelectorModal.classList.add('hidden');
        });

        cancelCardBtn.addEventListener('click', () => {
            cardSelectorModal.classList.add('hidden');
        });

        // ------------------ RECONOCIMIENTO IOS ------------------
        function initSpeechRecognition() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (SpeechRecognition) {
                recognition = new SpeechRecognition();
                recognition.lang = 'es-AR'; 
                recognition.interimResults = true;
                recognition.continuous = true;

                recognition.onresult = (event) => {
                    let latestTranscript = "";
                    for (let i = event.resultIndex; i < event.results.length; ++i) {
                        latestTranscript += event.results[i][0].transcript.toLowerCase();
                    }
                    
                    if (latestTranscript.trim() === "") return;
                    debugText.textContent = latestTranscript.slice(-40);

                    if (currentStatus === 'scanning' || currentStatus === 'idle') {
                        if (latestTranscript.includes("falso") || latestTranscript.includes("mentira") || latestTranscript.includes("falsa")) {
                            isFakeDetected = true;
                        }
                    }

                    if (currentStatus === 'success' && !cardRevealRequested) {
                        if (latestTranscript.includes("carta") && (latestTranscript.includes("analiza") || latestTranscript.includes("decime") || latestTranscript.includes("dime") || latestTranscript.includes("muestra") || latestTranscript.includes("ver"))) {
                            cardRevealRequested = true;
                            revealCard();
                        }
                    }
                };

                recognition.onerror = (event) => {
                    if (event.error !== 'no-speech') {
                        micStatus.textContent = "Error iOS: " + event.error;
                    }
                };

                recognition.onend = () => {
                    if (isScanningOrResult && recognition) {
                        try { recognition.start(); } catch(e) {}
                    }
                };
            } else {
                micStatus.textContent = "Safari no soporta API Voz aquí";
            }
        }

        // ENTRAR AL SISTEMA (Hack para iOS)
        enterBtn.addEventListener('click', async () => {
            // Inicializar motor de sonido
            initAudio();

            // Desbloquear el motor de voz (SpeechSynthesis)
            if ('speechSynthesis' in window) {
                const unlockAudio = new SpeechSynthesisUtterance('');
                speechSynthesis.speak(unlockAudio);
            }

            try {
                await navigator.mediaDevices.getUserMedia({ audio: true });
                micStatus.textContent = "Micro activado";
            } catch (err) {
                micStatus.textContent = "Permiso micro denegado";
            }

            isScanningOrResult = true;
            if (recognition) {
                try { recognition.start(); } catch(e) {}
            }

            startScreen.classList.add('hidden');
            mainScannerScreen.classList.remove('hidden');
            mainScannerScreen.classList.add('flex');
            showIdleScanner();
        });

        function showIdleScanner() {
            currentStatus = 'idle';
            body.className = "h-screen w-screen flex flex-col items-center justify-center relative bg-normal transition-colors duration-500";
            scannerIdle.classList.remove('hidden');
            scannerIdle.classList.add('flex');
            scannerActive.classList.add('hidden');
            scannerActive.classList.remove('flex');
            scannerResult.classList.add('hidden');
            scannerResult.classList.remove('flex');
            cardRevealContainer.classList.add('hidden');
            debugText.textContent = "..."; 
        }

        // INICIAR ESCANEO
        startScanBtn.addEventListener('click', () => {
            currentStatus = 'scanning';
            
            if (recognition) {
                try { recognition.stop(); } catch(e) {}
                setTimeout(() => { try { recognition.start(); } catch(e) {} }, 100);
            }

            // Iniciar sonido de radar
            startScanSound();

            isFakeDetected = false;
            cardRevealRequested = false;
            debugText.textContent = "..."; 

            scannerIdle.classList.add('hidden');
            scannerIdle.classList.remove('flex');
            scannerActive.classList.remove('hidden');
            scannerActive.classList.add('flex');

            const messages = [
                "Analizando señales...",
                "Buscando patrones...",
                "Calibrando frecuencia...",
                "Verificando datos..."
            ];

            let currentSecond = 0;
            progressBar.style.width = '0%';

            const scanInterval = setInterval(() => {
                currentSecond++;
                progressBar.style.width = `${(currentSecond / 4) * 100}%`;
                
                if (currentSecond < 4) {
                    scanText.textContent = messages[currentSecond];
                } else {
                    clearInterval(scanInterval);
                    finishScan();
                }
            }, 1000);
        });

        function finishScan() {
            stopScanSound(); // Detener pitidos de radar

            scannerActive.classList.add('hidden');
            scannerActive.classList.remove('flex');
            scannerResult.classList.remove('hidden');
            scannerResult.classList.add('flex');

            if (isFakeDetected) {
                currentStatus = 'error';
                playErrorSound(); // Sonido de error grave
                body.className = "h-screen w-screen flex flex-col items-center justify-center relative bg-error transition-colors duration-500";
                resultTitle.textContent = "FALSO";
            } else {
                currentStatus = 'success';
                playSuccessSound(); // Sonido de éxito agudo
                body.className = "h-screen w-screen flex flex-col items-center justify-center relative bg-success transition-colors duration-500";
                resultTitle.textContent = "VERDADERO";
            }
        }

        function revealCard() {
            if (currentStatus !== 'success') return;
            
            const card = localStorage.getItem('secretCard') || DEFAULT_CARD;
            secretCardDisplay.textContent = card.toUpperCase();
            cardRevealContainer.classList.remove('hidden');
            
            if ('speechSynthesis' in window) {
                const utterance = new SpeechSynthesisUtterance(`La carta elegida es el ${card}`);
                utterance.lang = 'es-AR';
                utterance.rate = 0.9;
                utterance.pitch = 0.8;
                speechSynthesis.speak(utterance);
            }
        }

        resetScanBtn.addEventListener('click', () => {
            showIdleScanner();
        });
    </script>
</body>
</html>
